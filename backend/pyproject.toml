[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
# importlib mode lets tests live in plain folders, without __init__.py files.
# No cache folder: tests run as root in the container over the mounted source, and on a Linux
# host the cache would be a root-owned folder the developer can't delete.
addopts = "--import-mode=importlib -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs, DJ: Django pitfalls
select = ["E", "F", "I", "UP", "B", "DJ"]
