name: Set up frontend
description: Node and pnpm with cached dependencies from pnpm-lock.yaml.

runs:
  using: composite
  steps:
    # Takes the pnpm version from packageManager in package.json, so CI matches local.
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: frontend/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
