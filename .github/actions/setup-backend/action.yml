name: Set up backend
description: Python with cached dependencies from requirements-dev.txt.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: backend/requirements*.txt

    - shell: bash
      working-directory: backend
      run: pip install -r requirements-dev.txt
