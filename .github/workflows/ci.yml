name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the outdated run, so minutes aren't spent on old commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checks only read the code; without this the token gets write access by default.
permissions:
  contents: read

# Throwaway values for the CI database; real secrets never live in the repository.
env:
  DJANGO_SECRET_KEY: ci-only-secret
  POSTGRES_DB: gymeri
  POSTGRES_USER: gymeri
  POSTGRES_PASSWORD: gymeri
  POSTGRES_HOST: localhost

# One job per check, so the PR shows exactly which one failed. Setup steps live in
# .github/actions to avoid repeating them in every job.
jobs:
  backend-lint:
    name: "Backend: lint (ruff check)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - run: ruff check .

  backend-format:
    name: "Backend: format (ruff format)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - run: ruff format --check .

  backend-migrations:
    name: "Backend: no missing migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # makemigrations checks the migration history against a live database.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: gymeri
          POSTGRES_USER: gymeri
          POSTGRES_PASSWORD: gymeri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymeri -d gymeri"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      # Fails when models.py changed but the migration was not created.
      - run: python manage.py makemigrations --check --dry-run

  backend-tests:
    name: "Backend: tests (pytest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: gymeri
          POSTGRES_USER: gymeri
          POSTGRES_PASSWORD: gymeri
        ports:
          - 5432:5432
        # Steps start only after PostgreSQL accepts connections, otherwise pytest fails on connect.
        options: >-
          --health-cmd "pg_isready -U gymeri -d gymeri"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - run: pytest

  frontend-lint:
    name: "Frontend: lint (eslint)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: pnpm lint

  frontend-typecheck:
    name: "Frontend: typecheck (tsc)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      # next-env.d.ts is gitignored, and without it tsc can't resolve CSS module imports.
      - run: pnpm exec next typegen
      - run: pnpm typecheck

  frontend-tests:
    name: "Frontend: tests (vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test
